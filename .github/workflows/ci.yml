name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app database main.py migrations
      - name: Smoke test application import
        env:
          USE_LOCAL_SQLITE: "true"
          SECRET_KEY: ci-only-secret
        run: python -c "from fastapi.testclient import TestClient; from main import app; assert TestClient(app).get('/docs').status_code == 200"
      - name: Build Docker image
        run: docker build --tag taskflow-api:ci .
      - name: Run Docker smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          docker rm --force taskflow-api-ci 2>$null
          docker run --detach --name taskflow-api-ci --publish 18000:8000 `
            --env USE_LOCAL_SQLITE=true `
            --env SECRET_KEY=ci-only-secret `
            taskflow-api:ci
          try {
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:18000/health" -UseBasicParsing
                if ($response.StatusCode -eq 200) { exit 0 }
              } catch { }
              Start-Sleep -Seconds 2
            }
            throw "Container did not become healthy in time."
          } finally {
            docker logs taskflow-api-ci
            docker rm --force taskflow-api-ci
          }
