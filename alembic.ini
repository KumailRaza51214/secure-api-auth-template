# Alembic configuration file.
# This project uses local SQLite only.

[alembic]
# Path to migration scripts (relative to %(here)s, the location of this file).
script_location = migrations

# This is prepended to sys.path so that the `app` and `database` packages
# can be imported from env.py.
prepend_sys_path = .

# Template used to generate migration file names.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file.
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file
# to be detected as revisions in the versions/ directory
# sourceless = false

# version location specification; defaults to <script_location>/versions
# version_locations = %(here)s/migrations/versions

# path_separator; to split list of version_locations
path_separator = os

# the output encoding used when revision files are written
output_encoding = utf-8

# Database URL - local SQLite only.
sqlalchemy.url = sqlite:///database/todos.db

[post_write_hooks]
# Optional: format with black / lint with ruff
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
